name: Construir APK

# Se ejecuta al hacer push, manualmente, y para cada Pull Request.
on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configurar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app web
        run: npm run build

      - name: Crear plataforma Android (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sincronizar web con Android
        run: npx cap sync android

      - name: Construir APK (debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mis-gastos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
