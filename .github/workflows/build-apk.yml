name: Construir APK

# Se ejecuta al hacer push, manualmente, y para cada Pull Request.
on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configurar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app web
        run: npm run build

      - name: Crear plataforma Android (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sincronizar web con Android
        run: npx cap sync android

      - name: Construir APK (debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mis-gastos.apk

      - name: Subir APK como artefacto (descarga desde Actions)
        uses: actions/upload-artifact@v4
        with:
          name: mis-gastos-apk
          path: mis-gastos.apk
          if-no-files-found: error

      # Publica el APK como Release con link de descarga directa.
      # Solo en pushes (no en Pull Requests).
      - name: Publicar APK como Release descargable
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Mis Gastos - último APK
          body: |
            APK de la app **Mis Gastos** lista para instalar en Android.

            Descargá `mis-gastos.apk`, pasalo a tu teléfono e instalalo
            (permitiendo "instalar apps de orígenes desconocidos").
          files: mis-gastos.apk
          fail_on_unmatched_files: true
